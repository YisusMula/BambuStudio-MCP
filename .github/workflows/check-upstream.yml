name: Check upstream

# Cada día mira si Bambu Lab ha publicado una versión más nueva que UPSTREAM_TAG,
# comprueba si nuestros parches se aplican sobre ella y abre un issue con el resultado.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6

      - name: Find newest upstream tag
        id: newest
        run: |
          current=$(tr -d '[:space:]' < UPSTREAM_TAG)
          newest=$(git ls-remote --tags --refs https://github.com/bambulab/BambuStudio 'v*' \
            | awk -F/ '{print $3}' | grep -E '^v[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$' | sort -V | tail -1)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          if [ "$(printf '%s\n%s\n' "$current" "$newest" | sort -V | tail -1)" != "$current" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Actual: $current · Más reciente: $newest"

      - name: Try patches on the new tag
        id: apply
        if: steps.newest.outputs.update == 'true'
        run: |
          git clone --quiet --depth 1 --branch "${{ steps.newest.outputs.newest }}" https://github.com/bambulab/BambuStudio upstream
          cd upstream
          result=ok
          : > ../apply.log
          for p in ../patches/*.patch; do
            if git apply --check "$p" >> ../apply.log 2>&1; then
              echo "OK  $(basename "$p")" >> ../apply.log
            else
              echo "FALLA  $(basename "$p")" >> ../apply.log
              result=conflict
              break
            fi
            git apply "$p"
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Open issue
        if: steps.newest.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ steps.newest.outputs.newest }}
          CURRENT: ${{ steps.newest.outputs.current }}
          RESULT: ${{ steps.apply.outputs.result }}
        run: |
          title="Nueva versión de Bambu Studio: $NEWEST"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title \"$title\"" --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "Ya existe un issue para $NEWEST"; exit 0
          fi
          channel=$(gh release view "$NEWEST" --repo bambulab/BambuStudio --json isPrerelease --jq 'if .isPrerelease then "beta" else "estable" end' 2>/dev/null || echo "sin release publicada en GitHub")
          if [ "$RESULT" = "ok" ]; then
            next="Los parches se aplican sin conflictos. Para actualizar: cambiar \`UPSTREAM_TAG\` a \`$NEWEST\` y lanzar **Build Windows**."
          else
            next="Los parches **no** se aplican: hay que actualizarlos a mano antes de compilar."
          fi
          {
            echo "Bambu Lab ha publicado **$NEWEST** (tipo: $channel). Ahora compilamos **$CURRENT**."
            echo
            echo "$next"
            echo
            echo '```'
            cat apply.log
            echo '```'
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
